# ============================================================
# AgentForge — Multi-Agent Orchestration Platform  v0.5
# ============================================================
#
# Quick start (all-Claude pipeline — one API key):
#   1. cp .env.example .env  (fill in your API keys)
#   2. pip install -r requirements.txt
#   3. python forge.py "build a React calculator"
#
# Switch providers with one command (REPL):
#   /switch deepseek     — all agents → DeepSeek
#   /switch anthropic    — all agents → Anthropic (default)
#   /switch openai       — all agents → OpenAI
#   /switch gemini       — all agents → Gemini
#
# Slash Commands (REPL mode): /help /doctor /init /agents /pipeline ...
# Web GUI: python forge.py --gui
# API Server: python forge.py --serve 8080
# ============================================================

# ── Provider Profiles (for /switch command) ──
profiles:
  anthropic:
    description: "All-Claude pipeline — one ANTHROPIC_API_KEY"
    agents:
      coder:      { provider: anthropic, model: claude-opus-4-8,   api_key_env: ANTHROPIC_API_KEY, description: "Claude Opus 4.8 — primary developer, full-stack" }
      reviewer:   { provider: anthropic, model: claude-sonnet-4-6,  api_key_env: ANTHROPIC_API_KEY, description: "Claude Sonnet 4.6 — code reviewer + technical analysis" }
      bugfixer:   { provider: anthropic, model: claude-sonnet-4-6,  api_key_env: ANTHROPIC_API_KEY, description: "Claude Sonnet 4.6 — bug fix specialist" }
      tester:     { provider: anthropic, model: claude-haiku-4-5,   api_key_env: ANTHROPIC_API_KEY, description: "Claude Haiku 4.5 — test writer + quality verification" }

  deepseek:
    description: "Budget-friendly DeepSeek pipeline — one DEEPSEEK_API_KEY"
    agents:
      coder:      { provider: deepseek, model: deepseek-chat,       api_key_env: DEEPSEEK_API_KEY, description: "DeepSeek Chat — primary developer, full-stack" }
      reviewer:   { provider: deepseek, model: deepseek-chat,       api_key_env: DEEPSEEK_API_KEY, description: "DeepSeek Chat — code reviewer + technical analysis" }
      bugfixer:   { provider: deepseek, model: deepseek-chat,       api_key_env: DEEPSEEK_API_KEY, description: "DeepSeek Chat — bug fix specialist" }
      tester:     { provider: deepseek, model: deepseek-chat,       api_key_env: DEEPSEEK_API_KEY, description: "DeepSeek Chat — test writer + quality verification" }

  openai:
    description: "GPT pipeline — one OPENAI_API_KEY"
    agents:
      coder:      { provider: openai, model: gpt-4.1,               api_key_env: OPENAI_API_KEY, description: "GPT-4.1 — primary developer, full-stack" }
      reviewer:   { provider: openai, model: gpt-4.1,               api_key_env: OPENAI_API_KEY, description: "GPT-4.1 — code reviewer + technical analysis" }
      bugfixer:   { provider: openai, model: gpt-4.1,               api_key_env: OPENAI_API_KEY, description: "GPT-4.1 — bug fix specialist" }
      tester:     { provider: openai, model: gpt-4o,                api_key_env: OPENAI_API_KEY, description: "GPT-4o — test writer + quality verification" }

  gemini:
    description: "Gemini pipeline — one GEMINI_API_KEY"
    agents:
      coder:      { provider: gemini, model: gemini-2.5-pro,        api_key_env: GEMINI_API_KEY, description: "Gemini 2.5 Pro — primary developer, full-stack" }
      reviewer:   { provider: gemini, model: gemini-2.5-pro,        api_key_env: GEMINI_API_KEY, description: "Gemini 2.5 Pro — code reviewer + technical analysis" }
      bugfixer:   { provider: gemini, model: gemini-2.5-pro,        api_key_env: GEMINI_API_KEY, description: "Gemini 2.5 Pro — bug fix specialist" }
      tester:     { provider: gemini, model: gemini-2.5-flash,      api_key_env: GEMINI_API_KEY, description: "Gemini 2.5 Flash — test writer + quality verification" }

# ── Global API settings ──
api:
  base_delay_ms: 500
  max_retries: 2
  timeout_seconds: 300

# ── Agent Legion ──
agents:

  coder:
    description: "Claude Opus 4.8 — primary developer, full-stack"
    provider: anthropic
    model: claude-opus-4-8
    api_key_env: ANTHROPIC_API_KEY
    system_prompt: |
      You are an expert software engineer. Write clean, well-structured,
      production-quality code. Include comments for non-obvious logic.
      Prefer standard libraries over third-party dependencies.
      When asked to create a project, produce complete, runnable files.
    capabilities:
      coding: 0.95
      architecture: 0.90
      fullstack: 0.88
      debugging: 0.75
      review: 0.60
      testing: 0.55
      reasoning: 0.80
      quick_fix: 0.70
      documentation: 0.70
    tech_preference:
      - typescript
      - react
      - vue
      - node.js
      - python

  reviewer:
    description: "Claude Sonnet 4.6 — code reviewer + technical analysis"
    provider: anthropic
    model: claude-sonnet-4-6
    api_key_env: ANTHROPIC_API_KEY
    system_prompt: |
      You are a thorough code reviewer. For every file you examine:
      1. Identify bugs, edge cases, and logic errors
      2. Flag security vulnerabilities (injection, auth, data leaks)
      3. Suggest performance improvements
      4. Note style/readability issues

      Be specific — reference exact lines or patterns in the code.
      If you find ANY issues that need fixing, append __HAS_ISSUES__
      to the END of your response. If the code is perfect, say
      "Code review passed — no issues found."
    capabilities:
      coding: 0.72
      architecture: 0.75
      fullstack: 0.60
      debugging: 0.75
      review: 0.95
      testing: 0.55
      reasoning: 0.92
      quick_fix: 0.60
      documentation: 0.92
    tech_preference:
      - any

  bugfixer:
    description: "Claude Sonnet 4.6 — bug fix specialist"
    provider: anthropic
    model: claude-sonnet-4-6
    api_key_env: ANTHROPIC_API_KEY
    system_prompt: |
      You are a bug-fixing specialist. Given a code review that identifies
      issues, fix every problem listed. For each fix:
      1. Explain what was wrong (1-2 lines)
      2. Provide the corrected code

      Preserve the original code's style and structure. Do not introduce
      new features — only fix the issues identified in the review.
    capabilities:
      coding: 0.75
      architecture: 0.55
      fullstack: 0.50
      debugging: 0.92
      review: 0.60
      testing: 0.50
      reasoning: 0.72
      quick_fix: 0.95
      documentation: 0.50
    tech_preference:
      - any

  tester:
    description: "Claude Haiku 4.5 — test writer + quality verification"
    provider: anthropic
    model: claude-haiku-4-5
    api_key_env: ANTHROPIC_API_KEY
    system_prompt: |
      You are a test engineer. Write comprehensive tests for the provided
      code. Include:
      1. Unit tests for core functions/methods
      2. Edge case coverage (empty inputs, nulls, boundary values)
      3. Basic integration tests where applicable

      Use the project's existing test framework if one exists; otherwise,
      use pytest (Python), Jest (JS/TS), or the standard testing library
      for the language in use.
    capabilities:
      coding: 0.65
      architecture: 0.60
      fullstack: 0.55
      debugging: 0.70
      review: 0.70
      testing: 0.95
      reasoning: 0.75
      quick_fix: 0.55
      documentation: 0.75
      verification: 0.95
    tech_preference:
      - any

# ── Task Classification Rules ──
classifier:
  rules:
    - type: testing
      keywords: ["测试", "test", "用例", "验证", "验收", "spec", "单元测试"]
      targets: []
    - type: review
      keywords: ["审查", "review", "检查", "有什么问题", "code review", "check", "audit", "inspect"]
      targets: []
    - type: bugfix
      keywords: ["修复", "bug", "报错", "异常", "不对", "坏了", "解决", "fix", "error", "broken", "crash"]
      targets: []
    - type: refactor
      keywords: ["重构", "优化", "改进", "提升", "整理", "refactor", "optimize", "improve"]
      targets: []
    - type: documentation
      keywords: ["文档", "注释", "readme", "document", "说明", "docs", "documentation"]
      targets: []
    - type: analysis
      keywords: ["分析", "解释", "为什么", "原理", "对比", "选型", "建议", "analyze", "explain", "compare"]
      targets: []
    - type: coding
      keywords: ["写", "开发", "实现", "新建", "创建", "搭建", "生成", "写个", "build", "create", "implement", "develop", "write", "make", "code", "add", "编写"]
      targets: []
  fallback: coding

# ── Task-Type → Capability-Weight Mapping ──
match_weights:
  coding:
    coding: 1.0
    architecture: 0.6
    fullstack: 0.5
  review:
    review: 1.0
    reasoning: 0.6
    documentation: 0.3
  bugfix:
    debugging: 1.0
    quick_fix: 0.9
    coding: 0.4
  testing:
    testing: 1.0
    verification: 0.8
    debugging: 0.3
  analysis:
    reasoning: 1.0
    review: 0.5
    architecture: 0.4
  refactor:
    coding: 1.0
    architecture: 0.7
    review: 0.3
  documentation:
    documentation: 1.0
    reasoning: 0.5
    review: 0.3

# ── Execution Config ──
executor:
  timeout_seconds: 300
  work_dir: "sessions"

# ── Git Integration (v0.5) ──
git:
  auto_commit: false
  commit_message_template: "AgentForge: {stage_id} — {task_summary}"
  branch_prefix: "forge/"

# ── Test Feedback Loop (v0.5) ──
test_loop:
  enabled: true
  max_iterations: 3
  fix_prompt: |
    The tests you wrote failed with the following output:

    {test_output}

    Fix the failing tests AND the source code if necessary. Make all tests pass.

# ── Pipeline: Full Development Cycle ──
pipelines:
  full_dev_cycle:
    description: "Code → Review → Fix(conditional) → Test"
    stages:
      - id: coding
        type: coding
        prompt: '{original_task}'
      - id: review
        type: review
        prompt: |
          Original task: {original_task}

          The following files were produced by the coding stage and are
          available in the working directory:

          {previous_files}

          Review each file thoroughly. Identify bugs, security issues,
          performance problems, and style concerns. Be specific.

          If you find ANY issues that need fixing, append __HAS_ISSUES__
          at the very end of your response. If everything looks good, say
          "Code review passed — no issues found."
        pass_files: true
      - id: bugfix
        type: bugfix
        prompt: |
          Original task: {original_task}

          The code review identified these issues:

          {previous_stdout}

          All project files are in the working directory:
          {all_files}

          Fix every issue listed above. For each fix, explain what was
          wrong and provide the corrected code.
        pass_files: true
        condition:
          stage: review
          marker: "__HAS_ISSUES__"
          fallback_check: true
      - id: testing
        type: testing
        prompt: |
          Original task: {original_task}

          Project files in working directory:
          {all_files}

          Completed stages summary:
          {stages_summary}

          Write comprehensive tests for the core business logic. Include
          unit tests and basic integration tests. Use the appropriate
          test framework for the project's language.
        pass_files: true
